[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jurispeed-challenge"
version = "0.1.0"
description = "Mini-orquestador multi-agente para el challenge tecnico de Jurispeed.ai"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.105.0",
  "boto3>=1.34.0",
  "botocore[crt]>=1.43.17",
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
jurispeed-challenge = "jurispeed_challenge.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
